name: Build Release

on:
  push:
    tags:
      - 'v*'  # 推送 v 开头的标签时触发
  workflow_dispatch:  # 支持手动触发

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build macOS app
        run: |
          pyinstaller --onefile --windowed \
            --name "No PDF Password" \
            --add-data "config.json:." \
            --add-data "src:src" \
            main.py
      
      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p No-PDF-Password-dmg
          cp "dist/No PDF Password" "No-PDF-Password-dmg/"
          create-dmg \
            --volname "No PDF Password" \
            --volicon "icon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "No PDF Password" 200 190 \
            --hide-extension "No PDF Password" \
            --app-drop-link 600 185 \
            "No-PDF-Password.dmg" \
            "No-PDF-Password-dmg/"
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: No-PDF-Password-macOS
          path: No-PDF-Password.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build Windows exe
        run: |
          pyinstaller --onefile --windowed `
            --name "No PDF Password" `
            --add-data "config.json;." `
            --add-data "src;src" `
            main.py
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: No-PDF-Password-Windows
          path: dist/No PDF Password.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: No-PDF-Password-macOS
          path: ./mac
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: No-PDF-Password-Windows
          path: ./win
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./mac/No-PDF-Password.dmg
            ./win/No PDF Password.exe
          generate_release_notes: true
